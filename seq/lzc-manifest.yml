application:
  subdomain: seq
  oidc_redirect_path: /oidc/callback
  upstreams:
    # 以 https 回源（自签证书，由 seqinit 生成），Seq 才会生成
    # https 且不带端口的 OIDC redirect_uri，与懒猫注册的回调地址一致
    - location: /
      backend: https://seq/
      disable_backend_ssl_verify: true
  ingress:
    - protocol: tcp
      port: 5341
      publish_port: 5341
      service: seq
    - protocol: udp
      port: 12201
      publish_port: 12201
      service: gelf
services:
  seq:
    image: datalust/seq:2026.1.17114
    # 包一层 run.sh：Seq 只在进程启动时读一次 OIDC 配置，而懒猫每次升级都会轮换
    # client_secret，故须在拉起正式实例之前写好设置（详见脚本内注释）
    entrypoint: ""
    command: bash /pkg/run.sh
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
      - LAZYCAT_AUTH_OIDC_CLIENT_ID=${LAZYCAT_AUTH_OIDC_CLIENT_ID}
      - LAZYCAT_AUTH_OIDC_CLIENT_SECRET=${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}
      - LAZYCAT_AUTH_OIDC_ISSUER_URI=${LAZYCAT_AUTH_OIDC_ISSUER_URI}
    binds:
      - /lzcapp/var/data:/data
      - /lzcapp/pkg/content/seq:/pkg
      - /lzcapp/pkg/content/seqinit:/seqinit
  gelf:
    image: datalust/seq-input-gelf:4.0.02323
    depends_on:
      - seq
    environment:
      - SEQ_ADDRESS=http://seq:5341
