application:
  subdomain: aipod
  upstreams:
    - location: /
      backend_launch_command: /lzcapp/pkg/content/netmap -target=192.168.50.12 -port=33 -udp-port=34
      backend: http://192.168.50.12:8080/
    - location: /
      domain_prefix: dockge
      backend: http://192.168.50.12:5001/
  ingress:
    - protocol: tcp
      port: 33
      publish_port: 0-65535
      send_port_info: true
    - protocol: udp
      port: 34
      publish_port: 0-65535
      send_port_info: true
