name: Build image for haos-qemu

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-haos-qemu.yml"
      - "docker/haos-qemu/Dockerfile"
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get image name and version
        id: image
        run: |
          version=$(grep -oP '(?<=^LABEL org\.opencontainers\.image\.version=)\d+\.\d+\.\d+$' docker/haos-qemu/Dockerfile)
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/haos-qemu" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=haos-qemu
          cache-to: type=gha,scope=haos-qemu,mode=max
          context: docker/haos-qemu
          platforms: linux/amd64
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      - name: Generate attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
