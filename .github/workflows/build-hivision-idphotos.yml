name: Build image for hivision-idphotos

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-hivision-idphotos.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hivision-idphotos

jobs:
  build-image:
    name: Build upstream ${{ matrix.source }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        source: [release, master]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Select upstream source and image tag
        id: source
        env:
          SOURCE: ${{ matrix.source }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $SOURCE == release ]]; then
            tag=$(gh api repos/Zeyi-Lin/HivisionIDPhotos/releases/latest --jq .tag_name)
            ref="refs/tags/$tag"
          else
            tag=latest
            ref="refs/heads/$SOURCE"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: Zeyi-Lin/HivisionIDPhotos
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests tqdm

      - name: Download models
        shell: bash
        run: |
          python scripts/download_model.py --models all | tee "$RUNNER_TEMP/models.log"
          if grep -Fq 'Download failed:' "$RUNNER_TEMP/models.log"; then exit 1; fi

      - name: Prepare build context
        run: |
          sed -i 's/libgl1-mesa-glx/libgl1 libgl1-mesa-dri/' Dockerfile
          # Both upstream versions call Blocks.launch(show_api=...), removed in Gradio 6.
          printf '\ngradio<6\n' >> requirements-app.txt
          printf '\n.git\n' >> .dockerignore

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ steps.source.outputs.tag }}
          labels: org.opencontainers.image.url=https://github.com/Zeyi-Lin/HivisionIDPhotos/tree/${{ steps.checkout.outputs.commit }}

      - name: Build and Push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          cache-from: type=gha,scope=hivision-idphotos
          cache-to: type=gha,scope=hivision-idphotos,mode=max
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      - name: Smoke-test published web and API services
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: |
          docker run --rm --entrypoint sh "$REGISTRY/${IMAGE_NAME,,}@$DIGEST" -ec '
            python -u app.py & web=$!
            python -u deploy_api.py & api=$!
            for attempt in $(seq 1 60); do
              kill -0 "$web" && kill -0 "$api" || exit 1
              if python -c "from urllib.request import urlopen; urlopen(\"http://127.0.0.1:7860/\", timeout=2); urlopen(\"http://127.0.0.1:8080/openapi.json\", timeout=2)" 2>/dev/null; then exit 0; fi
              sleep 2
            done
            exit 1
          '
