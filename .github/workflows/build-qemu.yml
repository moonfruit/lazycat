name: Build image for qemu

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Check content comparison
        run: python3 -B -m unittest discover -s docker/qemu

      - name: Select image and version
        run: |
          version=$(scripts/images/version.sh qemu)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/qemu" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate candidate image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ env.VERSION }}
          labels: org.opencontainers.image.revision=${{ inputs.sha }}

      - name: Build fresh candidate
        uses: docker/build-push-action@v7
        with:
          context: docker/qemu
          platforms: linux/amd64
          pull: true
          no-cache: true
          # The published digest receives a separate GitHub provenance attestation below.
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: |
            type=oci,dest=${{ runner.temp }}/candidate.oci
            type=tar,dest=${{ runner.temp }}/candidate.tar

      - name: Smoke-test the candidate filesystem and runtime
        run: |
          skopeo copy "oci-archive:$RUNNER_TEMP/candidate.oci" docker-daemon:qemu-ci:candidate
          docker/qemu/smoke.sh qemu-ci:candidate "$VERSION"

      - name: Compare with last published revision
        id: release
        run: docker/qemu/compare-release.sh "$IMAGE" "$VERSION" "$RUNNER_TEMP"

      - name: Upload new image by digest
        if: steps.release.outputs.changed == 'true'
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: skopeo copy --retry-times 3 --all --preserve-digests "oci-archive:$RUNNER_TEMP/candidate.oci" "docker://$IMAGE@$DIGEST"

      - name: Attest new revision
        if: steps.release.outputs.changed == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.release.outputs.digest }}
          push-to-registry: true

      - name: Publish revision and repair aliases
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: docker/qemu/promote.sh "$IMAGE" "$VERSION" "$REVISION" "$DIGEST"
