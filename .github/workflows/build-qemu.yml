name: Build image for qemu

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-qemu.yml"
      - "docker/qemu/**"
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

concurrency:
  group: qemu-ghcr-release
  cancel-in-progress: false

jobs:
  build-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Check content comparison
        run: python3 -B -m unittest discover -s docker/qemu

      - name: Select image and version
        run: |
          version=$(sed -n 's/^ARG QEMU_VERSION=//p' docker/qemu/Dockerfile)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/qemu" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate candidate image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ env.VERSION }}

      - name: Build fresh candidate
        uses: docker/build-push-action@v7
        with:
          context: docker/qemu
          platforms: linux/amd64
          pull: true
          no-cache: true
          # The published digest receives a separate GitHub provenance attestation below.
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: |
            type=oci,dest=${{ runner.temp }}/candidate.oci
            type=tar,dest=${{ runner.temp }}/candidate.tar

      - name: Compare with last published revision
        id: release
        run: docker/qemu/compare-release.sh "$IMAGE" "$VERSION" "$RUNNER_TEMP"

      - name: Upload new image by digest
        if: steps.release.outputs.changed == 'true'
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: skopeo copy --all --preserve-digests "oci-archive:$RUNNER_TEMP/candidate.oci" "docker://$IMAGE@$DIGEST"

      - name: Attest new revision
        if: steps.release.outputs.changed == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.release.outputs.digest }}
          push-to-registry: true

      - name: Publish revision and aliases
        if: steps.release.outputs.tags != ''
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          TAGS: ${{ steps.release.outputs.tags }}
        run: |
          git fetch --quiet origin main
          git diff --exit-code HEAD FETCH_HEAD -- docker/qemu .github/workflows/build-qemu.yml
          for tag in $TAGS; do
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$tag" "$IMAGE@$DIGEST"
          done
