name: Publish HttpBin LPK and software source

on:
  push:
    branches: [main]
    paths:
      - httpbin/lzc-*
      - httpbin/package.yml
      - httpbin/update.sh
      - scripts/lpk/**
      - .github/workflows/publish-httpbin.yml
  schedule:
    - cron: '43 21 * * *'
  workflow_dispatch:
    inputs:
      check_upstream:
        description: Check for a new stable PSF image version
        type: boolean
        default: false

concurrency:
  group: lpk-source-production
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.select.outputs.publish }}
      revision: ${{ steps.record.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check for a stable upstream version
        if: github.event_name != 'workflow_dispatch' || inputs.check_upstream
        run: ./httpbin/update.sh -N
      - name: Select release or repair a missing catalog deployment
        id: select
        env:
          CHECK_UPSTREAM: ${{ inputs.check_upstream }}
        run: |
          changed=false
          git diff --quiet -- httpbin/lzc-manifest.yml || changed=true
          publish=true
          if [[ $changed == false && ( $GITHUB_EVENT_NAME == schedule || $CHECK_UPSTREAM == true ) ]]; then
            version=$(yq -er '.version' httpbin/lzc-manifest.yml)
            url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/source/v2/index.json"
            if curl -fsSL --max-time 30 "$url" | jq -es --arg v "$version" \
                'any(.[].apps[]; .packageId == "com.github.moonfruit.httpbin" and .latestVersion.version == $v)'; then
              publish=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.select.outputs.publish == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: docker/setup-qemu-action@v4
        if: steps.select.outputs.publish == 'true'
        with:
          platforms: arm64
      - name: Test both architectures with the packaged startup command
        if: steps.select.outputs.publish == 'true'
        run: |
          npm install -g @lazycatcloud/lzc-cli@2.0.9
          lzc-cli project build httpbin -o "$RUNNER_TEMP/httpbin.lpk"
          lzc-cli lpk info "$RUNNER_TEMP/httpbin.lpk" | tee "$RUNNER_TEMP/lpk-info"
          version=$(yq -er '.version' httpbin/lzc-manifest.yml)
          grep -Fx "version: $version" "$RUNNER_TEMP/lpk-info"
          grep -Fx 'package: com.github.moonfruit.httpbin' "$RUNNER_TEMP/lpk-info"
          unzip -p "$RUNNER_TEMP/httpbin.lpk" manifest.yml > "$RUNNER_TEMP/manifest.yml"
          for arch in amd64 arm64; do
            bash scripts/lpk/smoke-httpbin.sh "$RUNNER_TEMP/manifest.yml" "linux/$arch"
          done
      - name: Record tested release revision
        if: steps.select.outputs.publish == 'true'
        id: record
        env:
          CHANGED: ${{ steps.select.outputs.changed }}
        run: |
          if [[ $CHANGED == true ]]; then
            version=$(yq -er '.version' httpbin/lzc-manifest.yml)
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- httpbin/lzc-manifest.yml
            git commit -m "chore(httpbin): update runtime image for LPK $version"
            git push origin HEAD:main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install -g @lazycatcloud/lzc-cli@2.0.9
      - name: Build and publish versioned LPK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: bash scripts/lpk/publish-httpbin.sh

  index:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build index from published releases and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/lpk/source.py "$BASE_URL" site/source/v2/index.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: index
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
