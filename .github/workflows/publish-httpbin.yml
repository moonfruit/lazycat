name: Publish HttpBin LPK and software source

on:
  push:
    branches: [main]
    paths:
      - httpbin/lzc-*
      - httpbin/package.yml
      - httpbin/update.sh
      - scripts/lpk/**
      - .github/workflows/publish-httpbin.yml
  schedule:
    - cron: '43 21 * * *'
  workflow_dispatch:
    inputs:
      check_upstream:
        description: Check for a new upstream image digest
        type: boolean
        default: false

concurrency:
  group: lpk-source-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.select.outputs.revision }}
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Check the upstream image
        if: github.event_name == 'schedule' || inputs.check_upstream
        run: ./httpbin/update.sh -N
      - id: changes
        run: |
          if git diff --quiet -- httpbin/lzc-manifest.yml; then
            echo 'image=false' >> "$GITHUB_OUTPUT"
          else
            echo 'image=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.image == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test updated package and image before recording the version
        if: steps.changes.outputs.image == 'true'
        run: |
          npm install -g @lazycatcloud/lzc-cli@2.0.9
          lzc-cli project build httpbin -o "$RUNNER_TEMP/httpbin.lpk"
          lzc-cli lpk info "$RUNNER_TEMP/httpbin.lpk" | tee "$RUNNER_TEMP/lpk-info"
          version=$(yq -r '.version' httpbin/lzc-manifest.yml)
          grep -Fx "version: $version" "$RUNNER_TEMP/lpk-info"
          grep -Fx 'package: com.github.moonfruit.httpbin' "$RUNNER_TEMP/lpk-info"
          image=$(yq -r '.services.httpbin.image' httpbin/lzc-manifest.yml)
          docker run -d --name httpbin -p 127.0.0.1:8000:80 "$image"
          curl -fsS --retry 12 --retry-all-errors --retry-delay 2 \
            'http://127.0.0.1:8000/get?source=lazycat' | jq -e '.args.source == "lazycat"'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- httpbin/lzc-manifest.yml
          git commit -m "chore(httpbin): update runtime image for LPK $version"
          git push origin HEAD:main
      - name: Select release or repair a missing catalog deployment
        id: select
        env:
          EVENT: ${{ github.event_name }}
          IMAGE_CHANGED: ${{ steps.changes.outputs.image }}
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          publish=true
          if [[ "$EVENT" == schedule && "$IMAGE_CHANGED" == false ]]; then
            version=$(yq -r '.version' httpbin/lzc-manifest.yml)
            url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/source/v2/index.json"
            if curl -fsSL --max-time 30 "$url" | jq -e --arg v "$version" \
                '.apps[] | select(.packageId == "com.github.moonfruit.httpbin") | .latestVersion.version == $v'; then
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install -g @lazycatcloud/lzc-cli@2.0.9
      - name: Build and publish versioned LPK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.revision }}
        run: bash scripts/lpk/publish-httpbin.sh

  index:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build index from published releases and verify public downloads
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/lpk/source.py "$BASE_URL" site/source/v2/index.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: index
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
