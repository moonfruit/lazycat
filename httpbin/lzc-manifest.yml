name: HttpBin
package: com.github.moonfruit.httpbin
version: 0.10.4.2
description: HTTP Request & Response Service, written in Python + Flask
license: https://choosealicense.com/licenses/isc/
homepage: https://github.com/psf/httpbin
author: MoonFruit
application:
  subdomain: httpbin
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://httpbin:8080/
      use_backend_host: false
services:
  httpbin:
    image: ghcr.io/moonfruit/httpbin:0.10.4
